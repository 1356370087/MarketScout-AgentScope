events {}

http {
  # 使用 Docker DNS 重新解析服务地址，避免容器重建换 IP 后持续返回 502。
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream research_frontend { zone research_frontend 64k; server frontend:3000 resolve; }
  upstream research_api { zone research_api 64k; server api:2024 resolve; }

  server {
    listen 80;
    server_name _;
    # Individual document limits remain enforced by the API. Archives contain many documents.
    client_max_body_size 10241m;

    location = /api/research/internal/sandbox {
      return 404;
    }

    location ^~ /api/research/internal/sandbox/ {
      return 404;
    }

    location /api/research/ {
      proxy_pass http://research_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location / {
      proxy_pass http://research_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
