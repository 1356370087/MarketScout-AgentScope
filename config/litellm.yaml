router_settings:
  # 通用负载均衡策略；Redis用于多 Proxy实例共享状态。
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  redis_host: os.environ/LITELLM_REDIS_HOST
  redis_port: os.environ/LITELLM_REDIS_PORT

litellm_settings:
  # prometheus callback 挂载 /metrics；鉴权默认开启，这里显式关闭以便
  # compose 内网的 Prometheus 免凭据抓取。生产环境不要把 4000 端口映射
  # 到不受信网络，或删掉下面这行走带凭据抓取。
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  # 初始请求失败后最多再执行两次物理重试。应用 SDK自身不重试。
  num_retries: 2
  # 单次请求超时，单位为秒。
  request_timeout: 180
  # 同一部署在失败窗口达到阈值后进入 cooldown。
  allowed_fails: 5
  cooldown_time: 60
  # 跨逻辑模型组 fallback。升级策略时新增版本别名，不要改写冻结别名。
  fallbacks:
    - if-supervisor-v1: [if-fallback-v1]
    - if-research-v1: [if-fallback-v1]
    - if-summarization-v1: [if-fallback-v1]
    - if-message-summary-v1: [if-fallback-v1]
    - if-web-rerank-v1: [if-fallback-v1]
    - if-web-evidence-v1: [if-fallback-v1]
    - if-compression-v1: [if-fallback-v1]
    - if-final-report-v1: [if-fallback-v1]
    - if-quality-v1: [if-fallback-v1]
    - if-report-review-v1: [if-fallback-v1]
    - if-evaluation-v1: [if-fallback-v1]
  # 上下文窗口不足时使用容量更大的模型组。
  context_window_fallbacks:
    - if-summarization-v1: [if-research-v1]
    - if-message-summary-v1: [if-research-v1]
    - if-web-rerank-v1: [if-research-v1]
    - if-web-evidence-v1: [if-research-v1]
    - if-compression-v1: [if-research-v1]
    - if-final-report-v1: [if-research-v1]
  # 当前 Compose 未部署 OTLP collector，也未安装 LiteLLM 的 OTel 可选依赖。
  # 启用采集时应先安装依赖、部署 collector，再在单独配置版本中添加 callback。
  turn_off_message_logging: true

general_settings:
  # Master Key只供控制面使用；普通调用使用 Run Key或受限 Service Key。
  master_key: os.environ/LITELLM_MASTER_KEY
  # PostgreSQL保存 Key、Budget和 Spend Logs。
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: false
