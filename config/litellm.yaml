  - model_name: if-embedding-v1
    litellm_params:
      model: dashscope/qwen3.7-text-embedding
      api_key: os.environ/DASHSCOPE_API_KEY
      dimensions: 1536
      max_parallel_requests: 16
      rpm: 600
      tpm: 1000000
    model_info:
      base_model: dashscope/qwen3.7-text-embedding
      # 原项目对单次嵌入输入的保守限制；不代表模型官方最大输入。
      max_input_tokens: 8191
      # 原文件沿用的估算成本（USD/token）；使用前请按账户实际定价核对。
      input_cost_per_token: 0.00000002
      output_cost_per_token: 0

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  redis_host: os.environ/LITELLM_REDIS_HOST
  redis_port: os.environ/LITELLM_REDIS_PORT
  # 注意：多个逻辑别名使用同一个 OPENAI_API_KEY，共享上游账号配额。
  # 因此不复制原 GLM 的 rpm/tpm 数值；按 OpenAI 实际项目额度、监控情况单独制定限流。
  # 同一密钥重复写多条 researcher 部署，并不会增加真实的上游配额。
  allowed_fails: 5
  cooldown_time: 60

litellm_settings:
  callbacks: ["prometheus"]
  # 仅适用于内网指标抓取；生产网络需限制端口访问或启用鉴权。
  require_auth_for_metrics_endpoint: false
  num_retries: 2
  request_timeout: 180
  # 出错时由 GPT-6.1 Sol 主链路回退至 DeepSeek，须事先验证 tool/structured output 兼容性。
  fallbacks:
    - if-supervisor-v2: [if-fallback-v2]
    - if-research-v2: [if-fallback-v2]
    - if-summarization-v2: [if-fallback-v2]
    - if-message-summary-v2: [if-fallback-v2]
    - if-web-rerank-v2: [if-fallback-v2]
    - if-web-evidence-v2: [if-fallback-v2]
    - if-compression-v2: [if-fallback-v2]
    - if-final-report-v2: [if-fallback-v2]
    - if-quality-v2: [if-fallback-v2]
    - if-report-review-v2: [if-fallback-v2]
    - if-evaluation-v2: [if-fallback-v2]
  # 删除原 context_window_fallbacks：主路由均为同一模型，上下文容量相同，
  # 转发至 researcher 不能扩容；超长输入应在应用层分块/检索/压缩。
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: false
