# InsightForge LiteLLM Proxy 路由配置
#
# 填写步骤：
# 1. 在 `.env` 中填写下方实际使用部署对应的 Provider API Key。
# 2. 修改 `litellm_params.model`，格式遵循 LiteLLM Provider规范，例如
#    `openai/gpt-4.1`、`deepseek/deepseek-chat`、
#    `anthropic/claude-sonnet-4-5`。
# 3. `model_name` 是应用调用的逻辑别名，必须与 `.env` 中的模型别名一致。
#    已被 Run引用的 v1 别名不得原地改变策略；升级时新增 v2。
# 4. 同一 `model_name` 下可以配置多个部署。Router会按 weight、rpm、tpm
#    和 max_parallel_requests 使用 simple-shuffle 进行负载均衡。
# 5. 每个部署必须声明 LiteLLM 已知的 `base_model`。未知或自托管模型必须
#    按文末模板显式声明 token限制与真实价格。
# 6. 当前研究与质量评估使用 Z.AI/GLM，回退使用 DeepSeek。
#    密钥使用 `.env` 中已配置的凭据，并通过 os.environ/ 引用，
#    禁止将明文密钥写入本文件（有测试守护）。

model_list:
  # Supervisor：负责研究规划与任务调度。
  - model_name: if-supervisor-v1
    litellm_params:
      model: zai/glm-5.3-flash
      api_base: os.environ/ZHIPU_BASE_URL
      api_key: os.environ/ZHIPU_API_KEY
      extra_body:
        thinking:
          type: disabled
      max_parallel_requests: 8
      weight: 1
      rpm: 300
      tpm: 300000
    model_info:
      base_model: zai/glm-5.3-flash
      # 部署保守上限（Token）；费用单位为美元/Token，核对日期 2026-09-12。
      # 价格来源：https://docs.z.ai/guides/overview/pricing
      max_input_tokens: 131072
      max_output_tokens: 32768
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000050

  # Researcher 主部署。相同逻辑别名下配置多个部署即可启用负载均衡。
