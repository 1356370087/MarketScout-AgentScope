router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  redis_host: os.environ/LITELLM_REDIS_HOST
  redis_port: os.environ/LITELLM_REDIS_PORT
litellm_settings:
  callbacks:
  - otel
  - prometheus
  require_auth_for_metrics_endpoint: false
  num_retries: 2
  request_timeout: 180
  allowed_fails: 5
  cooldown_time: 60
  fallbacks:
  - if-supervisor-v1:
    - if-fallback-v1
  - if-research-v1:
    - if-fallback-v1
  - if-summarization-v1:
    - if-fallback-v1
  - if-message-summary-v1:
    - if-fallback-v1
  - if-web-rerank-v1:
    - if-fallback-v1
  - if-web-evidence-v1:
    - if-fallback-v1
  - if-compression-v1:
    - if-fallback-v1
  - if-final-report-v1:
    - if-fallback-v1
  - if-quality-v1:
    - if-fallback-v1
  - if-report-review-v1:
    - if-fallback-v1
  - if-evaluation-v1:
    - if-fallback-v1
  context_window_fallbacks:
  - if-summarization-v1:
    - if-research-v1
  - if-message-summary-v1:
    - if-research-v1
  - if-web-rerank-v1:
    - if-research-v1
  - if-web-evidence-v1:
    - if-research-v1
  - if-compression-v1:
    - if-research-v1
  - if-final-report-v1:
    - if-research-v1
  turn_off_message_logging: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_spend_logs: false
